<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получение ключа пароля</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 35px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .key-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 16px 20px;
            color: #4fc3f7;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            word-break: break-all;
            min-height: 60px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .key-field.active {
            border-color: #4fc3f7;
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.2);
        }

        .key-field .placeholder {
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-get {
            background: linear-gradient(135deg, #4fc3f7, #29b6f6);
            color: #0a1929;
        }

        .btn-get:hover {
            background: linear-gradient(135deg, #81d4fa, #4fc3f7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 195, 247, 0.4);
        }

        .btn-copy {
            background: linear-gradient(135deg, #66bb6a, #43a047);
            color: #ffffff;
        }

        .btn-copy:hover {
            background: linear-gradient(135deg, #81c784, #66bb6a);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #43a047;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .key-icon {
            font-size: 20px;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔐 Получение ключа пароля</h1>
        <p class="subtitle">Нажмите кнопку для получения ключа доступа</p>

        <div class="key-field" id="keyField">
            <span class="placeholder">Ключ появится здесь...</span>
        </div>

        <div class="buttons">
            <button class="btn btn-get" id="btnGet" onclick="getKey()">🔑 Получить ключ</button>
            <button class="btn btn-copy" id="btnCopy" onclick="copyKey()">📋 Скопировать</button>
        </div>
    </div>

    <div class="toast" id="toast">✅ Ключ скопирован!</div>

    <script>
        const key = 'Vx2WF9JOzLFdi6i6JNnM7XIXq63YK65IBlKjif5EBEbA2ty9P9eIhXDhYaZSYszBh2exYn6qLwvy1jKoDnd6mAX2sl2C863h3BpE';
        let keyRevealed = false;

        function getKey() {
            const field = document.getElementById('keyField');
            const btnGet = document.getElementById('btnGet');

            if (!keyRevealed) {
                field.innerHTML = '<span class="key-icon">🔑</span> ' + key;
                field.classList.add('active');
                keyRevealed = true;
                btnGet.textContent = '✅ Ключ получен';
                btnGet.style.background = 'linear-gradient(135deg, #43a047, #388e3c)';
                btnGet.style.color = '#ffffff';
            } else {
                // Перегенерация — просто показать ключ снова (уже показан)
                field.innerHTML = '<span class="key-icon">🔑</span> ' + key;
                showToast('🔑 Ключ обновлён!');
            }
        }

        function copyKey() {
            if (!keyRevealed) {
                showToast('⚠️ Сначала получите ключ!');
                return;
            }
            navigator.clipboard.writeText(key).then(() => {
                showToast('✅ Ключ скопирован!');
            }).catch(() => {
                // Fallback для старых браузеров
                const textarea = document.createElement('textarea');
                textarea.value = key;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ Ключ скопирован!');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>

</body>
</html>
